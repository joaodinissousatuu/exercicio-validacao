name: CI

# Corre em cada pull request e em cada push para o main (incluindo merges).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo para o mesmo PR cancela a execução anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tipos, testes unitários e de integração)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Verificação de tipos (JSDoc + tsc)
        run: npm run typecheck

      - name: Testes unitários (domínio, sem base de dados)
        run: npm test

      # O mongodb-memory-server descarrega o binário do MongoDB (~120 MB) na primeira
      # execução; guardá-lo em cache evita repetir o download em cada execução.
      - name: Cache do binário do MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Testes de integração (API e repositórios com MongoDB em memória)
        run: npm run test:integration

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: Ponta a ponta (Playwright, frontend + backend + MongoDB em memória)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências do backend
        run: npm ci
        working-directory: backend

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: frontend

      - name: Cache do binário do MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Testes ponta a ponta
        run: npm run test:e2e
        working-directory: frontend

      # Em caso de falha, o relatório (com traces e capturas de ecrã) fica disponível
      # para download na página da execução.
      - name: Guardar o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
