name: CI

# Corre em cada pull request e em cada push para o main (incluindo merges).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo para o mesmo PR cancela a execução anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes unitários e de integração)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Testes unitários (domínio, sem base de dados)
        run: npm test

      # O mongodb-memory-server descarrega o binário do MongoDB (~120 MB) na primeira
      # execução; guardá-lo em cache evita repetir o download em cada execução.
      - name: Cache do binário do MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Testes de integração (API e repositórios com MongoDB em memória)
        run: npm run test:integration

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
